            request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
    LevelNotFound:
      description: LEVEL_NOT_FOUND (unknown level id) or LEVEL_VERSION_NOT_FOUND (no revision matches level_hash / level_version, or the current revision row is missing).
      content:
