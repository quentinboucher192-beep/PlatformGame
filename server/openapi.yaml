# Cosmic Online - OpenAPI 3.1 description of the REST API implemented in server/src.
# Every route, field, status and error code is taken from the source (index.ts lists the routes).
# Human-oriented French reference: docs/online/API.md.
openapi: 3.1.0
info:
  title: Cosmic Online API
  version: 1.0.0
  summary: Online rankings, replays, profiles and friends for Cosmic Platformer.
  description: |
    REST API of the Cosmic Online ranking service (Cloudflare Worker + D1 + R2). French reference: `docs/online/API.md`.

    **Conventions**
    - Every path is under `/api/v1` (included in the server URLs below). Dates are ISO 8601 UTC, times in milliseconds, ids lower-case UUIDs.
    - JSON responses: `{ok: true, data, meta?, request_id}` or `{ok: false, error: {code, message, details?}, request_id}`; headers `Content-Type: application/json; charset=utf-8`, `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`. Binary responses (avatar, replay) have no envelope.
    - JSON bodies require `Content-Type: application/json` (415 otherwise), must be a JSON object (400 INVALID_JSON) and are validated strictly: unknown fields, wrong types, out-of-range values and control characters give 400 VALIDATION_ERROR with `details: [{field, message}]`. `null` counts as absent (except where documented, e.g. PATCH /players/me).
    - Lists use `limit`/`offset`; `meta` = `{limit, offset, total, next_offset}`.
    - Any unknown path answers 404 NOT_FOUND, a known path with another method 405 METHOD_NOT_ALLOWED; HEAD is accepted wherever GET is. No CORS headers are emitted.
    - Anonymous GET requests (no Authorization header) on routes marked edge-cacheable may be served from the Cloudflare cache (15 s by default outside development, at most 300 s, `Cache-Control: public, max-age=N`).

    **Authentication**: `Authorization: Bearer <access_token>` (opaque, 1 h) obtained from /auth/register or /auth/login; renew with /auth/refresh (rotation, 120 s grace for a lost response, reuse after that revokes the session). The player is always identified from the session, never from a client-supplied id. Routes with an optional session (`security: [{}, bearerAuth]`) answer 401 when a header is sent but invalid or expired.

    **Rate limits** (fixed windows, keys hashed): register 5/h per IP; login 30/15 min per IP and 20/15 min per username; refresh 60/min per IP; submit 30/min per player; replay upload 20/min per player; profile writes (PATCH /players/me, PUT /players/me/avatar) 20/5 min per player; friend requests 30/h per player; account deletion 5/h per player; every GET 300/min per IP. 429 RATE_LIMITED with `Retry-After`.
servers:
- {url: 'http://127.0.0.1:8787/api/v1', description: Development (`npm run dev` = `wrangler dev --env dev`).}
- url: https://{workerHost}/api/v1
  description: 'Staging: your deployed Worker (`wrangler deploy --env staging`).'
  variables:
    workerHost: {default: your-staging-worker.example, description: Hostname of your deployed staging Worker.}
- url: https://{workerHost}/api/v1
  description: 'Production: your deployed Worker (`wrangler deploy`).'
  variables:
    workerHost: {default: your-production-worker.example, description: Hostname of your deployed production Worker.}
tags:
- {name: Health & meta}
- {name: Authentication}
- {name: Players}
- name: Leaderboards
  description: Only VERIFIED records are ranked; suspended accounts are never ranked; a board is always bound to one level revision (content hash) and one category.
- {name: Records & replays}
- name: Globe
  description: Coordinates are the approximate centre of the player's country, never a personal position.
- {name: Friends}
- {name: Social, description: "Private conversations between friends, groups, blocks and reports"}
- name: Administration
  description: 'Operators only: enabled when the ADMIN_TOKEN secret (>= 32 characters) is set, otherwise 404.'
paths:
  /health:
    get:
      tags: [Health & meta]
      operationId: getHealth
      summary: Service and database health
      security: []
      description: 'Runs `SELECT 1` on D1. Not cached. Note: like every GET it first goes through the per-IP `reads` rate limiter, which itself uses D1.'
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Health'}
              example:
                ok: true
                data:
                  status: ok
                  api_version: 1.0.0
                  environment: production
                  database: ok
                  time: '2026-11-13T09:00:00.000Z'
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: '`SELECT 1` failed (D1 unavailable). This route is not rate limited, so it answers even when D1 is down.'
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds before retrying (30).}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example:
                ok: false
                error: {code: SERVICE_UNAVAILABLE, message: Service temporairement indisponible., details: {database: unavailable}}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
  /meta:
    get:
      tags: [Health & meta]
      operationId: getMeta
      summary: API metadata, TOS version, categories and levels
      security: []
      description: Edge-cacheable for anonymous requests.
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Meta'}
              example:
                ok: true
                data:
                  api_version: 1.0.0
                  environment: production
                  tos_version: 2026-11
                  min_game_version: 2.1.0
                  categories: [ANY_PERCENT, HUNDRED_PERCENT, NO_DEATH, NO_DAMAGE, SPEEDRUN]
                  modes: [STANDARD]
                  levels:
                  - id: sylvanox_01
                    name: Les Ruines Suspendues
                    planet_id: sylvanox
                    planet_name: Sylvanox
                    order: 1
                    version: 1
                    content_hash: 0652230a14e586a34efa302cc4c617c8175bdc63c4ff8ae2cdc34dbda9227b08
                    ranking_enabled: true
                    min_game_version: 2.1.0
                    total_collectibles: 10
                    time_limit_ms: 900000
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/username-available:
    get:
      tags: [Authentication]
      operationId: usernameAvailable
      summary: Tell whether a username can be registered
      security: []
      description: 'Same rules as /auth/register. Rate limit `username_check`: 60 per 5 minutes per IP. Never cached. The registration stays authoritative (409 USERNAME_TAKEN).'
      parameters:
        - name: username
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [ok, data, request_id]
                properties:
                  ok: {type: boolean, enum: [true]}
                  data:
                    type: object
                    required: [username, available, reason, message]
                    properties:
                      username: {type: string}
                      available: {type: boolean}
                      reason: {type: string, nullable: true, enum: [invalid, reserved, taken, null]}
                      message: {type: string}
                  request_id: {type: string}
              example:
                ok: true
                data: {username: NovaRider, available: false, reason: taken, message: Ce pseudonyme est déjà utilisé.}
                request_id: 5e0c92a7-0237-42e2-973e-54ad4c6f3e0b
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account and open a session
      security: []
      description: 'Rate limit `register`: 5 per hour per IP (checked before the body is read). JSON body <= 8 KiB.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example:
              username: NovaRider
              password: sup3r secret pass
              country_code: FR
              location_visibility: globe
              accept_tos: true
              tos_version: 2026-11
      responses:
        '201':
          description: Account created; a session is open.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthResult'}
              example:
                ok: true
                data:
                  player:
                    id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    username: NovaRider
                    avatar: avatar_07
                    avatar_url: null
                    country_code: FR
                    region_code: null
                    location_visibility: globe
                    profile_visibility: public
                    allow_friend_requests: true
                    trust_level: 0
                    tos_version: 2026-11
                    created_at: '2026-11-13T09:12:44.512Z'
                    last_seen_at: '2026-11-13T09:12:44.512Z'
                    account_status: active
                  session:
                    access_token: JA4X-o_Dknel7UZHAScY6YGbw_CupBBdkzcEv8hNxoM
                    access_expires_at: '2026-11-13T10:12:44.530Z'
                    refresh_token: ggeyYnOLmtUCbypAk4h7cqglixzPd297BVpJkG3akwM
                    refresh_expires_at: '2026-12-13T09:12:44.530Z'
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400':
          description: 'VALIDATION_ERROR (details = list of {field, message}; unknown fields are refused), INVALID_JSON (body is not a JSON object) or BAD_REQUEST
            (invalid Content-Length header). Also: reserved username, password containing the username, accept_tos not true, outdated tos_version, region outside
            the country, visible location without country, unknown country.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [VALIDATION_ERROR, INVALID_JSON, BAD_REQUEST]}
              example:
                ok: false
                error:
                  code: VALIDATION_ERROR
                  message: Données invalides.
                  details:
                  - {field: player_id, message: champ inconnu}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '409':
          description: USERNAME_TAKEN (case-insensitive).
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [USERNAME_TAKEN]}
              example:
                ok: false
                error: {code: USERNAME_TAKEN, message: Ce pseudonyme est déjà utilisé.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with username and password
      security: []
      description: 'Rate limits: `login_ip` 30 per 15 min per IP (before the body is read), then `login_user` 20 per 15 min per username. After 10 consecutive wrong
        passwords the account is locked for 15 minutes (423). Unknown username and wrong password give the same 401 (same code, same message, same timing).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {username: novarider, password: sup3r secret pass}
      responses:
        '200':
          description: Logged in; a new session is open.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthResult'}
              example:
                ok: true
                data:
                  player:
                    id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    username: NovaRider
                    avatar: avatar_07
                    avatar_url: null
                    country_code: FR
                    region_code: null
                    location_visibility: globe
                    profile_visibility: public
                    allow_friend_requests: true
                    trust_level: 0
                    tos_version: 2026-11
                    created_at: '2026-11-13T09:12:44.512Z'
                    last_seen_at: '2026-11-13T09:12:44.512Z'
                    account_status: active
                  session:
                    access_token: JA4X-o_Dknel7UZHAScY6YGbw_CupBBdkzcEv8hNxoM
                    access_expires_at: '2026-11-13T10:12:44.530Z'
                    refresh_token: ggeyYnOLmtUCbypAk4h7cqglixzPd297BVpJkG3akwM
                    refresh_expires_at: '2026-12-13T09:12:44.530Z'
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: 'INVALID_CREDENTIALS: unknown username or wrong password.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [INVALID_CREDENTIALS]}
              example:
                ok: false
                error: {code: INVALID_CREDENTIALS, message: Pseudonyme ou mot de passe incorrect.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '403':
          description: 'ACCOUNT_SUSPENDED: correct password but the account is suspended.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [ACCOUNT_SUSPENDED]}
              example:
                ok: false
                error: {code: ACCOUNT_SUSPENDED, message: Ce compte est suspendu.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '423':
          description: 'ACCOUNT_LOCKED: too many failures; details.locked_until gives the end of the lock. Checked before the password.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [ACCOUNT_LOCKED]}
              example:
                ok: false
                error:
                  code: ACCOUNT_LOCKED
                  message: 'Trop d''échecs de connexion : compte temporairement verrouillé.'
                  details: {locked_until: '2026-11-13T09:27:44.000Z'}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refresh
      summary: Rotate the session tokens
      security: []
      description: 'Exchanges a refresh token for a new access + refresh pair; the previous access token stops working immediately. Re-presenting the previous refresh
        token within 120 s of the rotation (lost response) is accepted and rotates again. Re-presenting it later revokes the whole session (possible theft): 401 SESSION_REVOKED.
        Rate limit `refresh`: 60 per minute per IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
            example: {refresh_token: ggeyYnOLmtUCbypAk4h7cqglixzPd297BVpJkG3akwM}
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [session]
                      properties:
                        session: {$ref: '#/components/schemas/Session'}
              example:
                ok: true
                data:
                  session:
                    access_token: WorW03_9kL9BwSLWCZfNy4DGyIop0Bth5xhs0lEb42w
                    access_expires_at: '2026-11-13T10:12:44.530Z'
                    refresh_token: LIbjbNeSy23KulMbx-vL83GQAZ32TZvi0CUZ8cXgxR8
                    refresh_expires_at: '2026-12-13T09:12:44.530Z'
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: 'INVALID_REFRESH_TOKEN (unknown token), SESSION_REVOKED (reuse of a rotated token after the grace period, or session revoked meanwhile) or
            SESSION_EXPIRED (refresh token expired: log in again).'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [INVALID_REFRESH_TOKEN, SESSION_REVOKED, SESSION_EXPIRED]}
              example:
                ok: false
                error: {code: SESSION_REVOKED, message: 'Session révoquée par sécurité : reconnectez-vous.'}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '403': {$ref: '#/components/responses/AccountSuspended'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session (or all sessions)
      security:
      - {bearerAuth: []}
      description: The body is optional and only read when Content-Type starts with application/json. Not rate limited.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
            example: {all: true}
      responses:
        '200':
          description: Session(s) revoked.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [logged_out, all_sessions]
                      properties:
                        logged_out: {const: true}
                        all_sessions: {type: boolean}
              example:
                ok: true
                data: {logged_out: true, all_sessions: true}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountSuspended'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getMe
      summary: Private profile of the session owner
      security:
      - {bearerAuth: []}
      responses:
        '200':
          description: Current player.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [player]
                      properties:
                        player: {$ref: '#/components/schemas/PrivateProfile'}
              example:
                ok: true
                data:
                  player:
                    id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    username: NovaRider
                    avatar: avatar_07
                    avatar_url: null
                    country_code: FR
                    region_code: null
                    location_visibility: globe
                    profile_visibility: public
                    allow_friend_requests: true
                    trust_level: 0
                    tos_version: 2026-11
                    created_at: '2026-11-13T09:12:44.512Z'
                    last_seen_at: '2026-11-13T09:12:44.512Z'
                    account_status: active
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountSuspended'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /players/search:
    get:
      tags: [Players]
      operationId: searchPlayers
      summary: Search players by username prefix
      security: []
      description: Case-insensitive prefix match on active accounts; at most 20 results, shortest names first. No pagination. The Authorization header is ignored.
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_.-]{2,20}$'}
        description: Missing -> 400 ("2 caractères minimum"); other characters -> 400 ("format invalide").
      responses:
        '200':
          description: Matching players.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [players]
                      properties:
                        players:
                          type: array
                          maxItems: 20
                          items: {$ref: '#/components/schemas/PlayerSummary'}
              example:
                ok: true
                data:
                  players:
                  - id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    username: NovaRider
                    avatar: avatar_07
                    avatar_url: null
                    country_code: FR
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400':
          description: VALIDATION_ERROR on q.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [VALIDATION_ERROR]}
              example:
                ok: false
                error:
                  code: VALIDATION_ERROR
                  message: Paramètres de pagination invalides.
                  details:
                  - {field: limit, message: doit être entre 1 et 100}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /players/me/export:
    get:
      tags: [Players]
      operationId: exportMe
      summary: GDPR export of every personal data item
      security:
      - {bearerAuth: []}
      description: Password hashes, token hashes and IPs are never exported (IPs are only stored hashed). The export itself is written to the audit log.
      responses:
        '200':
          description: Personal data.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/ExportData'}
              example:
                ok: true
                data:
                  exported_at: '2026-11-13T10:00:00.000Z'
                  player:
                    id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    username: NovaRider
                    avatar: avatar_07
                    avatar_url: null
                    country_code: FR
                    region_code: null
                    location_visibility: globe
                    profile_visibility: public
                    allow_friend_requests: true
                    trust_level: 0
                    tos_version: 2026-11
                    created_at: '2026-11-13T09:12:44.512Z'
                    last_seen_at: '2026-11-13T09:12:44.512Z'
                    account_status: active
                  sessions:
                  - id: 1b6d87a5-39eb-4302-9cab-17710358a403
                    created_at: '2026-11-13T09:12:44.512Z'
                    last_used_at: '2026-11-13T09:40:02.110Z'
                    expires_at: '2026-11-13T10:12:44.530Z'
                    refresh_expires_at: '2026-12-13T09:12:44.530Z'
                    revoked_at: null
                    client_info: CosmicPlatformer/2.1.0
                  records: []
                  friends: []
                  replays: []
                  audit_log:
                  - {action: register, details: null, created_at: '2026-11-13T09:12:44.540Z'}
