  /records/{recordId}/replay:
    put:
      tags: [Records & replays]
      operationId: uploadReplay
      summary: Upload the replay of a run (CPRZ)
      security:
      - {bearerAuth: []}
      description: |-
        Owner only, once per attempt (the replay is attached to every record of the attempt). Raw body, Content-Type application/octet-stream, at most 1 048 576 bytes. Rate limit `replay_upload`: 20 per minute per player.

        An unreadable file is refused (422, nothing stored, the client may retry). A readable file is stored and analysed: it must match the record's level_id, level_hash and attempt_id, last time_ms +/- 500 ms, have a frame count consistent with its duration, not exceed the level time limit + 5 s, have ordered events inside the trace, the same number of deaths and of collectibles (Shard/Relic pickups) as the record, no Damage event when damage_taken is 0, a Finish event in the last second, start within 96 px of the spawn, end within 160 px of the exit zone, stay inside the level bounds and contain no impossible movement between two samples. The analysis result (VERIFIED/REJECTED) is returned with 201 in both cases, and every PENDING record of the attempt is re-evaluated.

        CPRZ container: bytes 0-3 ASCII `CPRZ`, bytes 4-7 uint32 little-endian inflated size (72 to 4 194 304), then a zlib stream (DecompressionStream "deflate") whose content is a CPRP v1 replay (little-endian): char[4] `CPRP`, u16 format_version (1), u16 sample_hz (10-120), u32 frame_count (> 0), u32 duration_ms, u32 event_count, u8[32] level_hash, u8[16] attempt_id (UUID bytes), u8 length + level_id (<= 64 bytes), u8 length + game_version (<= 16 bytes), frame_count x 12-byte frames {f32 x, f32 y, u8 state, u8 flags, u8 health, u8 reserved}, event_count x 8-byte events {u32 frame, u8 type, u8 arg, u16 value}; the inflated size must match exactly. Event types: 1 Jump, 2 AirJump, 3 Death, 4 Respawn, 5 Pickup (arg 0 Shard, 1 Relic, 2 Health, 3 Energy, 4 HeartContainer, 5 Secret), 6 Power, 7 Checkpoint, 8 Damage (value = amount), 9 Kill, 10 Teleport, 11 Finish.
      parameters:
      - {$ref: '#/components/parameters/RecordIdPath'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: Replay stored and analysed.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/ReplayUploadResult'}
              example:
                ok: true
                data:
                  replay_id: 890a226a-5041-4ddf-a1bd-917adc04bcf2
                  verification_status: VERIFIED
                  analysis:
                    ok: true
                    reasons: []
                    stats:
                      frames: 1831
                      duration_ms: 61000
                      deaths: 0
                      collectibles: 4
                      damage: 0
                      max_step_px: 82
                      jumps: 37
                  records:
                  - record:
                      id: 4b9c3c4e-374c-4fa8-a579-383df21bd26e
                      player_id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                      level_id: sylvanox_01
                      level_version: 1
                      level_hash: 0652230a14e586a34efa302cc4c617c8175bdc63c4ff8ae2cdc34dbda9227b08
                      mode: STANDARD
                      category: ANY_PERCENT
                      time_ms: 61000
                      deaths: 0
                      damage_taken: 0
                      collectibles: 4
                      total_collectibles: 10
                      score: 0
                      game_version: 2.1.0
                      verification_status: VERIFIED
                      has_replay: true
                      created_at: '2026-11-13T09:20:01.004Z'
                      verified_at: '2026-11-13T09:20:03.871Z'
                      attempt_id: 72c3f50d-4b27-46e4-8b70-f90de2db728a
                      rejection_reason: null
                      verification_notes: null
                    ranking:
                      previous_rank: null
                      rank: 1
                      total: 1
                      personal_best_improved: true
                      previous_best_ms: null
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400':
          description: 'BAD_REQUEST: invalid Content-Length header.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [BAD_REQUEST]}
              example:
                ok: false
                error: {code: BAD_REQUEST, message: En-tête Content-Length invalide.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: NOT_OWNER (record of another player) or ACCOUNT_SUSPENDED.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [ACCOUNT_SUSPENDED, NOT_OWNER]}
              example:
                ok: false
                error: {code: NOT_OWNER, message: Ce record ne vous appartient pas.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '404':
          description: RECORD_NOT_FOUND, or LEVEL_VERSION_NOT_FOUND (the record's revision is no longer registered).
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [RECORD_NOT_FOUND, LEVEL_VERSION_NOT_FOUND]}
              example:
                ok: false
                error: {code: RECORD_NOT_FOUND, message: Record introuvable.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '409':
          description: REPLAY_EXISTS (a replay is already attached to this attempt) or RECORD_REJECTED.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [REPLAY_EXISTS, RECORD_REJECTED]}
              example:
                ok: false
                error: {code: REPLAY_EXISTS, message: Un replay est déjà associé à cette tentative.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: 'UNSUPPORTED_MEDIA_TYPE: Content-Type is not application/octet-stream.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [UNSUPPORTED_MEDIA_TYPE]}
              example:
                ok: false
                error: {code: UNSUPPORTED_MEDIA_TYPE, message: Le replay doit être envoyé en application/octet-stream.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '422':
          description: 'REPLAY_MALFORMED: the container or replay cannot be read (message gives the reason).'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [REPLAY_MALFORMED]}
              example:
                ok: false
                error: {code: REPLAY_MALFORMED, message: 'Replay illisible : en-tête CPRZ absent.'}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Records & replays]
      operationId: downloadReplay
      summary: Download the replay of a record (CPRZ)
      security:
      - {}
      - {bearerAuth: []}
      description: Others can download only the VERIFIED replay of a VERIFIED record of a public, active profile. The owner can download their replay whatever its
        status. Never edge-cached.
      parameters:
      - {$ref: '#/components/parameters/RecordIdPath'}
      responses:
        '200':
          description: The CPRZ file exactly as uploaded.
          headers:
