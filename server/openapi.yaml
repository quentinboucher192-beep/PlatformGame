    RateLimited:
      description: 'RATE_LIMITED: fixed-window limit exceeded. Retry-After (seconds) and details.retry_after_seconds give the wait.'
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/ErrorEnvelope'}
            - type: object
              properties:
                error:
                  type: object
