                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '404':
          description: RECORD_NOT_FOUND (unknown or not visible), REPLAY_NOT_FOUND (no replay, replay not VERIFIED for a non-owner, or file missing).
          content:
            application/json:
              schema:
