                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [VALIDATION_ERROR, INVALID_JSON, BAD_REQUEST]}
              example:
                ok: false
                error:
                  code: VALIDATION_ERROR
                  message: Données invalides.
                  details:
                  - {field: player_id, message: champ inconnu}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: FRIEND_REQUESTS_DISABLED or ACCOUNT_SUSPENDED.
