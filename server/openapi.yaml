      tags: [Administration]
      operationId: adminRegisterLevels
      summary: Register the level revisions of a game release
      security:
      - {adminToken: []}
      description: 'Body = the levels of `CosmicPlatformer --online-manifest` (see server/scripts/register-levels.mjs), JSON <= 256 KiB, 1 to 500 levels. A new revision
        becomes current and older active ones become legacy (their boards stay readable, never mixed). Re-registering the same revision is idempotent (`unchanged`);
        a lower revision than the current one is `added_as_legacy`; a different hash under an existing revision number is refused (409). Levels are processed one
        by one: on a 409, the levels before it are already registered. Not rate limited.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterLevelsRequest'}
            example:
              levels:
              - id: sylvanox_01
                name: Les Ruines Suspendues
                planet_id: sylvanox
                planet_name: Sylvanox
                order: 1
                version: 1
                content_hash: 0652230a14e586a34efa302cc4c617c8175bdc63c4ff8ae2cdc34dbda9227b08
                total_collectibles: 10
                total_enemies: 20
                time_limit_ms: 900000
                min_time_ms: 30000
                bounds: [6000, 1200]
                spawn: [100, 500]
                exit: [5000, 400, 64, 96]
              game_version: 2.1.0
      responses:
        '200':
          description: Per-level result.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/RegisterLevelsResult'}
              example:
                ok: true
                data:
                  levels:
                  - {id: sylvanox_01, version: 1, result: current}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400':
          description: VALIDATION_ERROR (details = list of {field, message}; unknown fields are refused), INVALID_JSON (body is not a JSON object) or BAD_REQUEST
            (invalid Content-Length header). Field names are prefixed with `levels[i].`; `levels` must be an array of 1 to 500 objects.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [VALIDATION_ERROR, INVALID_JSON, BAD_REQUEST]}
              example:
                ok: false
                error:
                  code: VALIDATION_ERROR
                  message: Données invalides.
                  details:
                  - {field: player_id, message: champ inconnu}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '404':
          description: 'NOT_FOUND: the ADMIN_TOKEN secret is not configured (or shorter than 32 characters); the moderation routes then behave as if they did not
            exist.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [NOT_FOUND]}
              example:
                ok: false
                error: {code: NOT_FOUND, message: Ressource introuvable.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '409':
          description: 'REVISION_CONFLICT: this revision number already exists with another content hash.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [REVISION_CONFLICT]}
              example:
                ok: false
                error:
                  code: REVISION_CONFLICT
                  message: 'sylvanox_01 : la révision 1 existe avec un autre contenu (augmentez metadata.revision).'
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Player access token from /auth/register, /auth/login or /auth/refresh. The header must match `^Bearer [A-Za-z0-9_-]{20,100}$` (else 401 INVALID_TOKEN).
    adminToken:
      type: http
      scheme: bearer
      description: Value of the ADMIN_TOKEN Worker secret, compared in constant time. Operators only; never shipped with the game.
  parameters:
    PlayerIdPath:
      name: playerId
      in: path
      required: true
      description: Player UUID (lower-case). A malformed id gives 404 PLAYER_NOT_FOUND, not 400.
      schema: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    RecordIdPath:
      name: recordId
      in: path
      required: true
      description: Record UUID. A malformed id gives 404 RECORD_NOT_FOUND.
      schema: {type: string, pattern: '^[0-9a-f-]{36}$'}
    LevelIdPath:
      name: levelId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9_]{1,64}$'}
      description: Malformed -> 400 VALIDATION_ERROR (field level_id); unknown -> 404 LEVEL_NOT_FOUND.
    PlanetIdPath:
      name: planetId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9_]{1,64}$'}
    CountryCodePath:
      name: countryCode
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z]{2}$'}
      description: ISO 3166-1 alpha-2; upper-cased by the server (fr == FR).
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      description: Page size. Out of range or non-digit values -> 400 VALIDATION_ERROR.
    Limit200:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      description: Page size. Out of range or non-digit values -> 400 VALIDATION_ERROR.
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
    Category:
      name: category
      in: query
      schema:
        type: string
        enum: [ANY_PERCENT, HUNDRED_PERCENT, NO_DEATH, NO_DAMAGE, SPEEDRUN]
        default: ANY_PERCENT
    Period:
      name: period
      in: query
      schema: {type: string, enum: [all, weekly], default: all}
      description: 'weekly: best VERIFIED record of each player created since Monday 00:00 UTC (history is kept, the reset is logical).'
    Mode:
      name: mode
      in: query
      schema: {type: string, enum: [STANDARD], default: STANDARD}
      description: Validated only (a single mode exists).
    LevelIdQuery:
      name: level_id
      in: query
      schema: {type: string, pattern: '^[a-z0-9_]{1,64}$'}
    LevelIdQueryRequired:
      name: level_id
      in: query
      required: true
      schema: {type: string, pattern: '^[a-z0-9_]{1,64}$'}
      description: Missing -> 400 VALIDATION_ERROR ("obligatoire").
    LevelHash:
      name: level_hash
      in: query
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      description: 'Select a level revision by content hash (legacy boards). Takes precedence over level_version. Default: current revision.'
    LevelVersion:
      name: level_version
      in: query
      schema: {type: integer, minimum: 0, maximum: 999999}
      description: Select a level revision by number (1 to 6 digits).
    PlayerFilter:
      name: player
      in: query
      schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,20}$'}
      description: Case-insensitive username prefix filter. `rank` is then the rank among matches, `world_rank` the real rank.
    CountryQuery:
      name: country
      in: query
      schema: {type: string, pattern: '^[A-Z]{2}$'}
      description: Restrict to players of this country who do not hide their location (upper-case only).
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}
  schemas:
    SuccessEnvelope:
      type: object
      description: Every successful JSON response. Keys are always emitted in the order ok, data, meta, request_id.
      required: [ok, data, request_id]
      properties:
        ok: {const: true}
        data: {description: Route-specific payload.}
        meta: {$ref: '#/components/schemas/PageMeta', description: Present only on paginated lists.}
        request_id:
          type: string
          format: uuid
          description: Unique id of the request (also in the server logs). A response served from the edge cache repeats the id of the request that filled the cache.
    ErrorEnvelope:
      type: object
      description: Every error response (4xx/5xx). HTTP status and error.code always go together.
      required: [ok, error, request_id]
      properties:
        ok: {const: false}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: Stable machine-readable code (see the error table in docs/online/API.md).}
            message: {type: string, description: 'Human-readable message, in French. Never contains internal details.'}
            details:
              description: 'Optional, depends on the code: VALIDATION_ERROR -> array of FieldError; RATE_LIMITED -> {retry_after_seconds}; ACCOUNT_LOCKED -> {locked_until};
                LEVEL_VERSION_MISMATCH and LEVEL_VERSION_RETIRED -> {current_version}; GAME_VERSION_UNSUPPORTED -> {min_game_version}; CATEGORY_RULES_NOT_MET -> array
                of strings (French).'
              oneOf:
              - type: array
                items: {$ref: '#/components/schemas/FieldError'}
              - type: array
                items: {type: string}
              - type: object
                required: [retry_after_seconds]
                properties:
                  retry_after_seconds: {type: integer, minimum: 1}
              - type: object
                required: [locked_until]
                properties:
                  locked_until: {type: string, format: date-time}
              - type: object
                required: [current_version]
                properties:
                  current_version: {type: integer}
              - type: object
                required: [min_game_version]
                properties:
                  min_game_version: {type: string}
        request_id: {type: string, format: uuid}
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message:
          type: string
          description: French, e.g. "champ inconnu", "obligatoire", "format invalide", "doit être entre 1 et 100".
    PageMeta:
      type: object
      description: Pagination metadata (limit/offset).
      required: [limit, offset, total, next_offset]
      properties:
        limit: {type: integer}
        offset: {type: integer}
        total: {type: integer, description: Number of entries matching the query (all pages).}
        next_offset: {type: [integer, 'null'], description: 'offset + limit while it is below total, otherwise null.'}
    Category:
      type: string
      enum: [ANY_PERCENT, HUNDRED_PERCENT, NO_DEATH, NO_DAMAGE, SPEEDRUN]
      description: Ranking category.
    Mode: {type: string, enum: [STANDARD]}
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
      description: Only VERIFIED records ever appear in leaderboards, statistics ranks and on the globe.
    Avatar:
      type: string
      pattern: ^(avatar_(0[1-9]|1[0-6])|custom)$
      description: Preset avatar avatar_01..avatar_16, or `custom` after PUT /players/me/avatar.
    LocationVisibility:
      type: string
      enum: [hidden, country, globe]
      description: 'hidden: country never shown to others and excluded from country boards and the globe; country: country shown in rankings; globe: country shown
        and a marker placed at the country''s centre on the globe.'
    ProfileVisibility:
      type: string
      enum: [public, private]
      description: 'private: others only see the PlayerSummary (no statistics, no record list, no replay download).'
    PlayerSummary:
      type: object
      description: Minimal public identity (leaderboards, friends, search).
      required: [id, username, avatar, avatar_url, country_code]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        avatar: {$ref: '#/components/schemas/Avatar'}
        avatar_url:
          type: [string, 'null']
          description: '`/api/v1/players/{id}/avatar` when avatar is `custom`, otherwise null (path relative to the host).'
        country_code:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2; null when the player hides their location (or has none).
    PrivateProfile:
      type: object
      description: Everything the account owner may see about themselves.
      required:
      - id
      - username
      - avatar
      - avatar_url
      - country_code
      - region_code
      - location_visibility
      - profile_visibility
      - allow_friend_requests
      - trust_level
      - tos_version
      - created_at
      - last_seen_at
      - account_status
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        avatar: {$ref: '#/components/schemas/Avatar'}
        avatar_url: {type: [string, 'null']}
        country_code: {type: [string, 'null']}
        region_code: {type: [string, 'null'], description: 'ISO 3166-2 subdivision (e.g. FR-IDF), never a city.'}
        location_visibility: {$ref: '#/components/schemas/LocationVisibility'}
        profile_visibility: {$ref: '#/components/schemas/ProfileVisibility'}
        allow_friend_requests: {type: boolean}
        trust_level:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 new account, 1 >= 3 verified runs with replay, 2 >= 15, 3 set manually in the database (no API route sets it). Any REJECTED record in the
            last 30 days drops it to 0, even from 3.
        tos_version: {type: string}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        account_status: {type: string, enum: [active, suspended]}
    OwnProfile:
      allOf:
      - {$ref: '#/components/schemas/PrivateProfile'}
      - type: object
        required: [hidden]
        properties:
          hidden: {const: false}
      description: GET /players/{playerId} when the viewer is that player.
    PublicProfile:
      allOf:
      - {$ref: '#/components/schemas/PlayerSummary'}
      - type: object
        required: [region_code, created_at, hidden, friendship]
        properties:
          region_code: {type: [string, 'null'], description: null when the country is hidden.}
          created_at: {type: string, format: date-time}
          hidden: {const: false}
          friendship:
            type: [string, 'null']
            enum: [friends, request_sent, request_received, null]
            description: Relation with the authenticated viewer; null for anonymous viewers or no relation.
      description: GET /players/{playerId} of a public profile seen by someone else.
    HiddenProfile:
      allOf:
      - {$ref: '#/components/schemas/PlayerSummary'}
      - type: object
        required: [hidden]
        properties:
          hidden: {const: true}
      description: GET /players/{playerId} of a private profile seen by someone else.
    Session:
      type: object
      description: Session tokens. Only SHA-256 digests are stored server-side.
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 'Opaque 256-bit token (base64url). Send as `Authorization: Bearer <token>`.'
        access_expires_at: {type: string, format: date-time, description: Default lifetime 3600 s (ACCESS_TOKEN_TTL_SECONDS).}
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 'Opaque token, single use: rotated by every POST /auth/refresh.'
        refresh_expires_at:
          type: string
          format: date-time
          description: Default lifetime 30 days (REFRESH_TOKEN_TTL_DAYS); slides forward on each refresh.
    AuthResult:
      type: object
      required: [player, session]
      properties:
        player: {$ref: '#/components/schemas/PrivateProfile'}
        session: {$ref: '#/components/schemas/Session'}
    RegisterRequest:
      type: object
      required: [username, password, accept_tos, tos_version]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9_.-]{1,18})[A-Za-z0-9]$
          description: 'Trimmed. Unique case-insensitively (409 USERNAME_TAKEN). Reserved names are refused (400): after lower-casing and removing `_`, `.`, `-`,
            equal to admin, administrator, moderator, modo, cosmic, cosmicstudio, system, support, root, null, undefined, anonymous, staff, or starting with `<reserved>team`
            or with `official`.'
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must not contain the username (case-insensitive). Stored as PBKDF2-HMAC-SHA256.
        avatar: {type: string, pattern: '^avatar_(0[1-9]|1[0-6])$', default: avatar_01}
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Must exist in the server's country table (400 "pays inconnu").
        region_code:
          type: string
          maxLength: 6
          pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
          description: Requires country_code and must start with `<country_code>-`.
        location_visibility:
          $ref: '#/components/schemas/LocationVisibility'
          default: hidden
          description: Anything but hidden requires country_code.
        profile_visibility: {$ref: '#/components/schemas/ProfileVisibility', default: public}
        allow_friend_requests: {type: boolean, default: true}
        accept_tos: {type: boolean, description: Must be true.}
        tos_version:
          type: string
          maxLength: 32
          description: Must equal the server's current TOS version (see GET /meta `tos_version`).
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 32, description: Trimmed; case-insensitive.}
        password: {type: string, minLength: 1, maxLength: 128}
      additionalProperties: false
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, minLength: 20, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$'}
      additionalProperties: false
    LogoutRequest:
      type: object
      properties:
        all: {type: boolean, default: false, description: true revokes every session of the player.}
      additionalProperties: false
    PlanetProgress:
      type: object
      required: [planet_id, planet_name, levels, completed_levels, completed]
      properties:
        planet_id: {type: string}
        planet_name: {type: string}
        levels: {type: integer, description: Ranked levels of the planet.}
        completed_levels: {type: integer, description: Levels with a verified ANY_PERCENT best on the current revision.}
        completed: {type: boolean}
    BestTime:
      type: object
      required: [level_id, level_name, planet_id, category, time_ms, record_id, achieved_at, rank]
      properties:
        level_id: {type: string}
        level_name: {type: string}
        planet_id: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        time_ms: {type: integer}
        record_id: {type: string, format: uuid}
        achieved_at: {type: string, format: date-time}
        rank: {type: integer, description: 'World rank on the current revision (ties: earlier achieved_at, then player id).'}
    Statistics:
      type: object
      description: Computed from VERIFIED records only (except submitted_records).
      required:
      - verified_records
      - submitted_records
      - personal_bests
      - levels_completed
      - first_places
      - planets
      - planets_completed
      - best_times
      properties:
        verified_records: {type: integer}
        submitted_records: {type: integer, description: 'Every submission, whatever its status.'}
        personal_bests: {type: integer, description: Verified bests on current level revisions (all categories).}
        levels_completed: {type: integer, description: Distinct levels with a verified ANY_PERCENT best on the current revision.}
        first_places: {type: integer}
        planets:
          type: array
          items: {$ref: '#/components/schemas/PlanetProgress'}
        planets_completed: {type: integer}
        best_times:
          type: array
          items: {$ref: '#/components/schemas/BestTime'}
    PlayerProfile:
      type: object
      required: [player, statistics]
      properties:
        player:
          oneOf:
          - {$ref: '#/components/schemas/OwnProfile'}
          - {$ref: '#/components/schemas/PublicProfile'}
          - {$ref: '#/components/schemas/HiddenProfile'}
        statistics:
          oneOf:
          - {$ref: '#/components/schemas/Statistics'}
          - {type: 'null'}
          description: null for a private profile seen by someone else.
    Record:
      type: object
      description: Public view of a record (what other players see). `kills` is stored but never returned here.
      required:
      - id
      - player_id
      - level_id
      - level_version
      - level_hash
      - mode
      - category
      - time_ms
      - deaths
      - damage_taken
      - collectibles
      - total_collectibles
      - score
      - game_version
      - verification_status
      - has_replay
      - created_at
      - verified_at
      properties:
        id: {type: string, format: uuid}
        player_id: {type: string, format: uuid}
        level_id: {type: string}
        level_version: {type: integer}
        level_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        mode: {$ref: '#/components/schemas/Mode'}
        category: {$ref: '#/components/schemas/Category'}
        time_ms: {type: integer}
        deaths: {type: integer}
        damage_taken: {type: integer}
        collectibles: {type: integer}
        total_collectibles: {type: integer}
        score: {type: integer}
        game_version: {type: string}
        verification_status: {$ref: '#/components/schemas/VerificationStatus'}
        has_replay: {type: boolean, description: A replay file is attached to the attempt (whatever its analysis result).}
        created_at: {type: string, format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
    RecordOwner:
      allOf:
      - {$ref: '#/components/schemas/Record'}
      - type: object
        required: [attempt_id, rejection_reason, verification_notes]
        properties:
          attempt_id: {type: string, format: uuid}
          rejection_reason:
            type: [string, 'null']
            description: IMPOSSIBLE_TIME, TIME_OVER_LIMIT, REPLAY_INVALID, MODERATION, or the moderator's free text.
          verification_notes: {type: [string, 'null'], description: 'Why a record is PENDING, or the replay analysis reasons (French).'}
      description: Owner view of a record.
    RankingChange:
      type: object
      required: [previous_rank, rank, total, personal_best_improved, previous_best_ms]
      properties:
        previous_rank: {type: [integer, 'null'], description: Rank of the player's best on this board before the decision.}
        rank: {type: [integer, 'null'], description: Rank after the decision (null when not ranked).}
        total: {type: integer, description: Players ranked on the board (level revision + category).}
        personal_best_improved: {type: boolean}
        previous_best_ms: {type: [integer, 'null']}
    SubmitRequest:
      type: object
      description: 'There is deliberately no player_id: the player is the session owner. Sending player_id (or any unknown field) gives 400 VALIDATION_ERROR "champ
        inconnu".'
      required: [level_id, level_version, level_hash, category, time_ms, deaths, game_version, attempt_id]
      properties:
        level_id: {type: string, maxLength: 64, pattern: '^[a-z0-9_]{1,64}$'}
        level_version: {type: integer, minimum: 1, maximum: 1000000}
        level_hash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          description: Content hash of the exact level revision played.
        mode: {$ref: '#/components/schemas/Mode', default: STANDARD}
        category: {$ref: '#/components/schemas/Category'}
        time_ms: {type: integer, minimum: 1, maximum: 86400000}
        deaths: {type: integer, minimum: 0, maximum: 9999}
        damage_taken: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        collectibles: {type: integer, minimum: 0, maximum: 10000, default: 0}
        total_collectibles:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
          description: Must equal the level revision's total (422 INCONSISTENT_PROGRESS).
        kills: {type: integer, minimum: 0, maximum: 100000, default: 0}
        score: {type: integer, minimum: 0, maximum: 100000000, default: 0}
        game_version: {type: string, maxLength: 16, pattern: '^\d{1,3}\.\d{1,3}\.\d{1,4}$'}
        attempt_id:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Lower-case UUID v4 generated by the client for the run. Makes submission idempotent; one attempt may be submitted once per category.
        has_replay: {type: boolean, default: false, description: Echoed back as replay.accepted; has no other effect.}
      additionalProperties: false
    SubmitResult:
      type: object
      required: [duplicate, record, replay, ranking]
      properties:
        duplicate: {const: false}
        record: {$ref: '#/components/schemas/RecordOwner'}
        replay:
          type: object
          required: [required, accepted, upload_path]
          properties:
            required: {type: boolean, description: true when no replay is attached yet and the record is PENDING.}
            accepted: {type: boolean, description: Echo of the request's has_replay flag.}
            upload_path: {type: string, description: '`/api/v1/records/{id}/replay` (PUT the CPRZ file there).'}
        ranking: {$ref: '#/components/schemas/RankingChange'}
    SubmitDuplicate:
      type: object
      description: 'Same attempt_id and category already stored with identical time_ms, deaths and level_hash: the stored record is returned, nothing changes.'
      required: [duplicate, record, replay, ranking]
      properties:
        duplicate: {const: true}
        record: {$ref: '#/components/schemas/RecordOwner'}
        replay:
          type: object
          required: [required, upload_path]
          properties:
            required: {type: boolean}
            upload_path: {type: string}
        ranking: {type: 'null'}
    RecordDetail:
      type: object
      required: [record, player, is_personal_best, rank]
      properties:
        record:
          anyOf:
          - {$ref: '#/components/schemas/RecordOwner'}
          - {$ref: '#/components/schemas/Record'}
          description: Owner view when the viewer owns the record.
        player: {$ref: '#/components/schemas/PlayerSummary'}
        is_personal_best: {type: boolean}
        rank:
          type: [integer, 'null']
          description: Current world rank, only when the record is VERIFIED and is the player's personal best; otherwise null.
    ReplayAnalysis:
      type: object
      required: [ok, reasons, stats]
      properties:
        ok: {type: boolean}
        reasons:
          type: array
          items: {type: string}
          description: Every inconsistency found (French); empty when ok.
        stats:
          type: object
          required: [frames, duration_ms, deaths, collectibles, damage, max_step_px, jumps]
          properties:
            frames: {type: integer}
            duration_ms: {type: integer}
            deaths: {type: integer}
            collectibles: {type: integer, description: Shard and Relic pickups.}
            damage: {type: integer}
            max_step_px: {type: integer}
            jumps: {type: integer}
    ReplayUploadResult:
      type: object
      required: [replay_id, verification_status, analysis, records]
      properties:
        replay_id: {type: string, format: uuid}
        verification_status:
          type: string
          enum: [VERIFIED, REJECTED]
          description: Result of the replay analysis (not necessarily the records' status).
        analysis: {$ref: '#/components/schemas/ReplayAnalysis'}
        records:
          type: array
          description: Every record of the same attempt that was still PENDING, re-evaluated with the replay (empty when none was pending).
          items:
            type: object
            required: [record, ranking]
            properties:
              record: {$ref: '#/components/schemas/RecordOwner'}
              ranking: {$ref: '#/components/schemas/RankingChange'}
    LevelInfo:
      type: object
      required:
      - id
      - name
      - planet_id
      - planet_name
      - order
      - version
      - content_hash
      - ranking_enabled
      - min_game_version
      - total_collectibles
      - time_limit_ms
      properties:
        id: {type: string}
        name: {type: string}
        planet_id: {type: string}
        planet_name: {type: string}
        order: {type: integer}
        version: {type: integer, description: Current revision.}
        content_hash: {type: string}
        ranking_enabled: {type: boolean}
        min_game_version: {type: string}
        total_collectibles: {type: integer}
        time_limit_ms: {type: integer}
    Meta:
      type: object
      required: [api_version, environment, tos_version, min_game_version, categories, modes, levels]
      properties:
        api_version: {type: string, example: 1.0.0}
        environment: {type: string, description: 'development, staging or production.'}
        tos_version: {type: string}
        min_game_version: {type: string}
        categories:
          type: array
          items: {$ref: '#/components/schemas/Category'}
        modes:
          type: array
          items: {$ref: '#/components/schemas/Mode'}
        levels:
          type: array
          items: {$ref: '#/components/schemas/LevelInfo'}
          description: Every registered level (ranking_enabled tells whether it is ranked).
    Health:
      type: object
      required: [status, api_version, environment, database, time]
      properties:
        status: {type: string, enum: [ok]}
        api_version: {type: string}
        environment: {type: string}
        database: {type: string, enum: [ok]}
        time: {type: string, format: date-time}
    LevelBoardInfo:
      type: object
      required:
      - level_id
      - name
      - planet_id
      - planet_name
      - version
      - content_hash
      - compatibility_status
      - is_current
      - ranking_enabled
      - category
      - mode
      - period
      - week_start
      - week_end
      - country_code
      - friends
      properties:
        level_id: {type: string}
        name: {type: string}
        planet_id: {type: string}
        planet_name: {type: string}
        version: {type: integer}
        content_hash: {type: string}
        compatibility_status: {type: string, enum: [active, legacy, disabled]}
        is_current: {type: boolean}
        ranking_enabled: {type: boolean}
        category: {$ref: '#/components/schemas/Category'}
        mode: {$ref: '#/components/schemas/Mode'}
        period: {type: string, enum: [all, weekly]}
        week_start:
          type: [string, 'null']
          format: date-time
          description: Monday 00:00 UTC of the current week (weekly only).
        week_end: {type: [string, 'null'], format: date-time}
        country_code: {type: [string, 'null']}
        friends: {type: boolean}
    LevelBoardEntry:
      type: object
      description: 'Best VERIFIED time of one player. Ties: earlier achieved_at, then player id.'
      required: [rank, world_rank, player, time_ms, record_id, achieved_at, has_replay, is_me]
      properties:
        rank: {type: integer, description: Rank inside this (possibly filtered) board.}
        world_rank: {type: integer, description: Rank on the unfiltered world board of the same revision/category/period.}
        player: {$ref: '#/components/schemas/PlayerSummary'}
        time_ms: {type: integer}
        record_id: {type: string, format: uuid}
        achieved_at: {type: string, format: date-time}
        has_replay: {type: boolean, description: A VERIFIED replay is available for download.}
        is_me: {type: boolean}
    PendingPerformance:
      type: object
      description: 'The viewer''s best PENDING record on this board: reported, never ranked.'
      required: [record_id, time_ms, created_at, note, status]
      properties:
        record_id: {type: string, format: uuid}
        time_ms: {type: integer}
        created_at: {type: string, format: date-time}
        note: {type: [string, 'null']}
        status: {const: PENDING}
    LevelBoardMe:
      type: object
      description: Viewer's own position, even outside the requested page.
      required: [entry, pending]
      properties:
        entry:
          oneOf:
          - {$ref: '#/components/schemas/LevelBoardEntry'}
          - {type: 'null'}
        pending:
          oneOf:
          - {$ref: '#/components/schemas/PendingPerformance'}
          - {type: 'null'}
    LevelBoard:
      type: object
      required: [board, entries, me]
      properties:
        board: {$ref: '#/components/schemas/LevelBoardInfo'}
        entries:
          type: array
          items: {$ref: '#/components/schemas/LevelBoardEntry'}
        me:
          oneOf:
          - {$ref: '#/components/schemas/LevelBoardMe'}
          - {type: 'null'}
          description: null for anonymous requests.
    GlobalPointsEntry:
      type: object
      description: 'Ties: points desc, levels_completed desc, total_time_ms asc, player id.'
      required: [rank, world_rank, player, points, levels_completed, total_time_ms, is_me]
      properties:
        rank: {type: integer}
        world_rank: {type: integer}
        player: {$ref: '#/components/schemas/PlayerSummary'}
        points: {type: integer, description: Sum over ranked levels of floor(1000 x world best / player best).}
        levels_completed: {type: integer}
        total_time_ms: {type: integer}
        is_me: {type: boolean}
    GlobalPointsBoard:
      type: object
      required: [board, entries, me]
      properties:
        board:
          type: object
          required: [kind, category, country_code]
          properties:
            kind: {const: cosmic_points}
            category: {$ref: '#/components/schemas/Category'}
            country_code: {type: [string, 'null']}
        entries:
          type: array
          items: {$ref: '#/components/schemas/GlobalPointsEntry'}
        me:
          oneOf:
          - type: object
            required: [entry, pending]
            properties:
              entry:
                oneOf:
                - {$ref: '#/components/schemas/GlobalPointsEntry'}
                - {type: 'null'}
              pending: {type: 'null'}
          - {type: 'null'}
    PlanetTotalEntry:
      type: object
      description: Only players with a verified best on every ranked level (current revisions) of the planet.
      required: [rank, world_rank, player, total_time_ms, levels_completed, is_me]
      properties:
        rank: {type: integer}
        world_rank: {type: integer}
        player: {$ref: '#/components/schemas/PlayerSummary'}
        total_time_ms: {type: integer, description: Sum of the player's best times over every ranked level of the planet.}
        levels_completed: {type: integer}
        is_me: {type: boolean}
    PlanetBoard:
      type: object
      required: [board, entries, me]
      properties:
        board:
          type: object
          required: [kind, planet_id, category, levels, country_code]
          properties:
            kind: {const: planet_total_time}
            planet_id: {type: string}
            category: {$ref: '#/components/schemas/Category'}
            levels:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: {type: string}
                  name: {type: string}
            country_code: {type: [string, 'null']}
        entries:
          type: array
          items: {$ref: '#/components/schemas/PlanetTotalEntry'}
        me:
          oneOf:
          - type: object
            required: [entry, pending]
            properties:
              entry:
                oneOf:
                - {$ref: '#/components/schemas/PlanetTotalEntry'}
                - {type: 'null'}
              pending: {type: 'null'}
          - {type: 'null'}
    GlobeMarker:
      type: object
      description: Only players with location_visibility = globe whose country has coordinates.
      required:
      - record_id
      - player_id
      - player_name
      - avatar
      - avatar_url
      - country_code
      - latitude
      - longitude
      - time_ms
      - rank
      - level_id
      - achieved_at
      - is_me
      properties:
        record_id: {type: string, format: uuid}
        player_id: {type: string, format: uuid}
        player_name: {type: string}
        avatar: {$ref: '#/components/schemas/Avatar'}
        avatar_url: {type: [string, 'null']}
        country_code: {type: string}
        latitude: {type: number, description: 'Approximate centre of the country, never a personal position.'}
        longitude: {type: number}
        time_ms: {type: integer}
        rank: {type: integer, description: World rank on the board.}
        level_id: {type: string}
        achieved_at: {type: string, format: date-time}
        is_me: {type: boolean}
    GlobeRecords:
      type: object
      required: [level_id, category, period, records, generated_at]
      properties:
        level_id: {type: [string, 'null']}
        category: {$ref: '#/components/schemas/Category'}
        period: {type: string, enum: [all, weekly]}
        records:
          type: array
          items: {$ref: '#/components/schemas/GlobeMarker'}
        generated_at: {type: string, format: date-time}
    GlobeCountryRecords:
      type: object
      required: [country_code, level_id, category, period, records, generated_at]
      properties:
        country_code: {type: string}
        level_id: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        period: {type: string, enum: [all, weekly]}
        records:
          type: array
          items: {$ref: '#/components/schemas/GlobeMarker'}
        generated_at: {type: string, format: date-time}
    GlobeCountry:
      type: object
      required: [country_code, name_fr, name_en, latitude, longitude, players, best_time_ms, best_rank, best_player]
      properties:
        country_code: {type: string}
        name_fr: {type: string}
        name_en: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        players:
          type: integer
          description: Globe-visible players (on the board with level_id; with any verified best in the category otherwise).
        best_time_ms: {type: [integer, 'null'], description: null without level_id.}
        best_rank: {type: [integer, 'null'], description: null without level_id.}
        best_player: {type: [string, 'null'], description: Username of the country's best player; null without level_id.}
    GlobeCountries:
      type: object
      required: [level_id, category, period, countries, generated_at]
      properties:
        level_id: {type: [string, 'null']}
        category: {$ref: '#/components/schemas/Category'}
        period: {type: string, enum: [all, weekly]}
        countries:
          type: array
          items: {$ref: '#/components/schemas/GlobeCountry'}
        generated_at: {type: string, format: date-time}
    FriendEntry:
      type: object
      required: [player, since]
      properties:
        player: {$ref: '#/components/schemas/PlayerSummary'}
        since: {type: string, format: date-time}
    FriendLists:
      type: object
      description: Sorted by username; suspended players are omitted.
      required: [friends, incoming, outgoing]
      properties:
        friends:
          type: array
          items: {$ref: '#/components/schemas/FriendEntry'}
        incoming:
          type: array
          items: {$ref: '#/components/schemas/FriendEntry'}
          description: Pending requests received.
        outgoing:
          type: array
          items: {$ref: '#/components/schemas/FriendEntry'}
          description: Pending requests sent.
    FriendRequest:
      type: object
      description: username or player_id is required.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9_.-]{1,18})[A-Za-z0-9]$
          description: Case-insensitive. Takes precedence over player_id.
        player_id: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
      additionalProperties: false
    FriendRequestResult:
      type: object
      required: [status, player]
      properties:
        status: {type: string, enum: [pending, accepted]}
        player: {$ref: '#/components/schemas/PlayerSummary'}
    FriendAccept:
      type: object
      required: [player_id]
      properties:
        player_id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: The requester.
      additionalProperties: false
    FriendAcceptResult:
      type: object
      required: [status, player]
      properties:
        status: {const: accepted}
        player:
          oneOf:
          - {$ref: '#/components/schemas/PlayerSummary'}
          - {type: 'null'}
    PatchMeRequest:
      type: object
      description: Every field is optional; omitted fields keep their value.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9_.-]{1,18})[A-Za-z0-9]$
          description: Same rules as at registration (reserved names refused, 409 if taken).
        avatar:
          type: string
          pattern: ^avatar_(0[1-9]|1[0-6])$
          description: Choosing a preset deletes the uploaded custom avatar.
        country_code:
          type: [string, 'null']
          pattern: ^[A-Z]{2}$
          description: null clears the country, the region, and forces location_visibility to hidden.
        region_code:
          type: [string, 'null']
          maxLength: 6
          pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
          description: null clears it. Must belong to the (new or current) country.
        location_visibility:
          $ref: '#/components/schemas/LocationVisibility'
          description: Silently forced to hidden when the resulting profile has no country.
        profile_visibility: {$ref: '#/components/schemas/ProfileVisibility'}
        allow_friend_requests: {type: boolean}
      additionalProperties: false
    DeleteMeRequest:
      type: object
      required: [password, confirm]
      properties:
        password: {type: string, minLength: 1, maxLength: 128}
        confirm: {const: DELETE, maxLength: 16}
      additionalProperties: false
    RecordRow:
      type: object
      description: Raw row of the `records` table (GDPR export and moderation only).
      required:
      - id
      - player_id
      - level_id
      - level_version
      - level_hash
      - mode
      - category
      - time_ms
      - deaths
      - damage_taken
      - collectibles
      - total_collectibles
      - kills
      - score
      - game_version
      - attempt_id
      - verification_status
      - rejection_reason
      - verification_notes
      - replay_id
      - created_at
      - verified_at
      properties:
        id: {type: string, format: uuid}
        player_id: {type: string, format: uuid}
        level_id: {type: string}
        level_version: {type: integer}
        level_hash: {type: string}
        mode: {type: string}
        category: {type: string}
        time_ms: {type: integer}
        deaths: {type: integer}
        damage_taken: {type: integer}
        collectibles: {type: integer}
        total_collectibles: {type: integer}
        kills: {type: integer}
        score: {type: integer}
        game_version: {type: string}
        attempt_id: {type: string, format: uuid}
        verification_status: {$ref: '#/components/schemas/VerificationStatus'}
        rejection_reason: {type: [string, 'null']}
        verification_notes: {type: [string, 'null']}
        replay_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
    ExportData:
      type: object
      required: [exported_at, player, sessions, records, friends, replays, audit_log, notes]
      properties:
        exported_at: {type: string, format: date-time}
        player: {$ref: '#/components/schemas/PrivateProfile'}
        sessions:
          type: array
          items:
            type: object
            required: [id, created_at, last_used_at, expires_at, refresh_expires_at, revoked_at, client_info]
            properties:
              id: {type: string, format: uuid}
              created_at: {type: string, format: date-time}
              last_used_at: {type: string, format: date-time}
              expires_at: {type: string, format: date-time}
              refresh_expires_at: {type: string, format: date-time}
              revoked_at: {type: [string, 'null'], format: date-time}
              client_info: {type: [string, 'null'], description: 'User-Agent, truncated to 120 characters.'}
        records:
          type: array
          items: {$ref: '#/components/schemas/RecordRow'}
        friends:
          type: array
          items:
            type: object
            required: [player_id, friend_id, status, created_at]
            properties:
              player_id: {type: string, format: uuid}
              friend_id: {type: string, format: uuid}
              status: {type: string, enum: [pending, accepted]}
              created_at: {type: string, format: date-time}
        replays:
          type: array
          items:
            type: object
            required:
            - id
            - record_id
            - attempt_id
            - file_size
            - sha256
            - format_version
            - frame_count
            - duration_ms
            - verification_status
            - created_at
            properties:
              id: {type: string, format: uuid}
              record_id: {type: string, format: uuid}
              attempt_id: {type: string, format: uuid}
              file_size: {type: integer}
              sha256: {type: string}
              format_version: {type: integer}
              frame_count: {type: integer}
              duration_ms: {type: integer}
              verification_status: {$ref: '#/components/schemas/VerificationStatus'}
              created_at: {type: string, format: date-time}
        audit_log:
          type: array
          items:
            type: object
            required: [action, details, created_at]
            properties:
              action: {type: string}
              details: {type: [string, 'null'], description: JSON text.}
              created_at: {type: string, format: date-time}
        notes: {type: string}
    AdminRecordRow:
      allOf:
      - {$ref: '#/components/schemas/RecordRow'}
      - type: object
        required: [username, trust_level, analysis]
        properties:
          username: {type: string}
          trust_level: {type: integer}
          analysis: {type: [string, 'null'], description: 'Replay analysis as JSON text, null without replay.'}
    ReviewRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [VERIFIED, REJECTED]}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    ReviewResult:
      type: object
      required: [record_id, verification_status, ranking]
      properties:
        record_id: {type: string, format: uuid}
        verification_status: {type: string, enum: [VERIFIED, REJECTED]}
        ranking: {$ref: '#/components/schemas/RankingChange'}
    ManifestLevel:
      type: object
      description: One level revision, as produced by `CosmicPlatformer --online-manifest`. Validation errors are reported as `levels[i].<field>`.
      required:
      - id
      - name
      - planet_id
      - order
      - version
      - content_hash
      - total_collectibles
      - total_enemies
      - time_limit_ms
      - min_time_ms
      - bounds
      - spawn
      - exit
      properties:
        id: {type: string, maxLength: 64, pattern: '^[a-z0-9_]{1,64}$'}
        name: {type: string, minLength: 1, maxLength: 80}
        planet_id: {type: string, maxLength: 64, pattern: '^[a-z0-9_]{1,64}$'}
        planet_name: {type: string, maxLength: 80}
        order: {type: integer, minimum: 0, maximum: 1000}
        version: {type: integer, minimum: 1, maximum: 1000000}
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        total_collectibles: {type: integer, minimum: 0, maximum: 10000}
        total_enemies: {type: integer, minimum: 0, maximum: 100000}
        time_limit_ms: {type: integer, minimum: 1000, maximum: 86400000}
        min_time_ms: {type: integer, minimum: 0, maximum: 86400000}
        bounds:
          type: array
          items: {type: number}
          minItems: 2
          maxItems: 2
          description: '[width, height]'
        spawn:
          type: array
          items: {type: number}
          minItems: 2
          maxItems: 2
          description: '[x, y]'
        exit:
          type: array
          items: {type: number}
          minItems: 4
          maxItems: 4
          description: '[x, y, w, h]'
      additionalProperties: false
    RegisterLevelsRequest:
      type: object
      required: [levels]
      properties:
        levels:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/ManifestLevel'}
        game_version:
          type: string
          pattern: ^\d{1,3}\.\d{1,3}\.\d{1,4}$
          description: min_game_version of the new revisions; when absent or malformed the server's MIN_GAME_VERSION is used.
    RegisterLevelsResult:
      type: object
      required: [levels]
      properties:
        levels:
          type: array
          items:
            type: object
            required: [id, version, result]
            properties:
              id: {type: string}
              version: {type: integer}
              result: {type: string, enum: [current, unchanged, added_as_legacy]}
  responses:
    BadRequest:
      description: VALIDATION_ERROR (details = list of {field, message}; unknown fields are refused), INVALID_JSON (body is not a JSON object) or BAD_REQUEST (invalid
        Content-Length header).
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/ErrorEnvelope'}
            - type: object
              properties:
                error:
                  type: object
                  properties:
                    code: {type: string, enum: [VALIDATION_ERROR, INVALID_JSON, BAD_REQUEST]}
          example:
            ok: false
            error:
              code: VALIDATION_ERROR
              message: Données invalides.
              details:
              - {field: player_id, message: champ inconnu}
            request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
    InvalidQuery:
      description: 'VALIDATION_ERROR: a query or path parameter is malformed or out of range.'
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/ErrorEnvelope'}
            - type: object
              properties:
                error:
                  type: object
                  properties:
                    code: {type: string, enum: [VALIDATION_ERROR]}
          example:
            ok: false
            error:
              code: VALIDATION_ERROR
              message: Paramètres de pagination invalides.
              details:
              - {field: limit, message: doit être entre 1 et 100}
            request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
    Unauthorized:
      description: 'UNAUTHORIZED (no Authorization header), INVALID_TOKEN (malformed header, unknown or revoked session) or TOKEN_EXPIRED (access token expired: call
        POST /auth/refresh).'
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/ErrorEnvelope'}
            - type: object
              properties:
                error:
                  type: object
                  properties:
                    code: {type: string, enum: [UNAUTHORIZED, INVALID_TOKEN, TOKEN_EXPIRED]}
          example:
            ok: false
            error: {code: TOKEN_EXPIRED, message: 'Jeton expiré : utilisez le jeton de renouvellement.'}
            request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
    InvalidOrExpiredToken:
      description: 'Only when an Authorization header is sent: INVALID_TOKEN (malformed, unknown or revoked) or TOKEN_EXPIRED. Anonymous requests never get a 401
        here.'
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/ErrorEnvelope'}
            - type: object
              properties:
                error:
                  type: object
                  properties:
                    code: {type: string, enum: [INVALID_TOKEN, TOKEN_EXPIRED]}
          example:
            ok: false
            error: {code: INVALID_TOKEN, message: Session inconnue ou révoquée.}
            request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
    AccountSuspended:
      description: 'ACCOUNT_SUSPENDED: the session belongs to a suspended account.'
