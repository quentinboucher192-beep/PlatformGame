  /records/submit:
    post:
      tags: [Records & replays]
      operationId: submitRecord
      summary: Submit a run
      security:
      - {bearerAuth: []}
      description: |-
        The player is the session owner; `player_id` is refused. JSON body <= 4 KiB. Rate limit `submit`: 30 per minute per player.

        Checks, in order: schema -> level exists (404) -> ranking enabled (403) -> exact revision: level_version exists and its content hash equals level_hash (409 LEVEL_VERSION_MISMATCH) -> revision still active (409 LEVEL_VERSION_RETIRED) -> game_version >= the revision's and the server's minimum (426) -> category rules (422) -> progression consistency (422) -> idempotence on attempt_id.

        Server decision (the client is never trusted): time below the revision's min_time_ms -> REJECTED IMPOSSIBLE_TIME; above time_limit_ms -> REJECTED TIME_OVER_LIMIT; otherwise, with an already-analysed replay of the same attempt: invalid -> REJECTED REPLAY_INVALID; SPEEDRUN without a valid replay -> PENDING; new world record more than 20 % below the current one and trust_level < 3 -> PENDING; new world record on a board of >= 5 players and trust_level < 2 -> PENDING; valid replay -> VERIFIED; trust_level >= 2 -> VERIFIED; else PENDING (waiting for the replay).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitRequest'}
            example:
              level_id: sylvanox_01
              level_version: 1
              level_hash: 0652230a14e586a34efa302cc4c617c8175bdc63c4ff8ae2cdc34dbda9227b08
              category: ANY_PERCENT
              time_ms: 61000
              deaths: 0
              damage_taken: 0
              collectibles: 4
              total_collectibles: 10
              game_version: 2.1.0
              attempt_id: 72c3f50d-4b27-46e4-8b70-f90de2db728a
              has_replay: true
      responses:
        '200':
          description: 'Duplicate: this attempt was already stored in this category with the same data; the stored record is returned.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/SubmitDuplicate'}
              example:
                ok: true
                data:
                  duplicate: true
                  record:
                    id: 4b9c3c4e-374c-4fa8-a579-383df21bd26e
                    player_id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    level_id: sylvanox_01
                    level_version: 1
                    level_hash: 0652230a14e586a34efa302cc4c617c8175bdc63c4ff8ae2cdc34dbda9227b08
                    mode: STANDARD
                    category: ANY_PERCENT
                    time_ms: 61000
                    deaths: 0
                    damage_taken: 0
                    collectibles: 4
                    total_collectibles: 10
                    score: 0
                    game_version: 2.1.0
                    verification_status: PENDING
                    has_replay: false
                    created_at: '2026-11-13T09:20:01.004Z'
                    verified_at: null
                    attempt_id: 72c3f50d-4b27-46e4-8b70-f90de2db728a
                    rejection_reason: null
                    verification_notes: En attente du replay.
                  replay: {required: true, upload_path: /api/v1/records/4b9c3c4e-374c-4fa8-a579-383df21bd26e/replay}
                  ranking: null
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '201':
          description: Record stored with the server's decision.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SuccessEnvelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/SubmitResult'}
              example:
                ok: true
                data:
                  duplicate: false
                  record:
                    id: 4b9c3c4e-374c-4fa8-a579-383df21bd26e
                    player_id: a908a1fb-a574-47c3-b6ed-f550f36cc212
                    level_id: sylvanox_01
                    level_version: 1
                    level_hash: 0652230a14e586a34efa302cc4c617c8175bdc63c4ff8ae2cdc34dbda9227b08
                    mode: STANDARD
                    category: ANY_PERCENT
                    time_ms: 61000
                    deaths: 0
                    damage_taken: 0
                    collectibles: 4
                    total_collectibles: 10
                    score: 0
                    game_version: 2.1.0
                    verification_status: PENDING
                    has_replay: false
                    created_at: '2026-11-13T09:20:01.004Z'
                    verified_at: null
                    attempt_id: 72c3f50d-4b27-46e4-8b70-f90de2db728a
                    rejection_reason: null
                    verification_notes: En attente du replay.
                  replay: {required: true, accepted: true, upload_path: /api/v1/records/4b9c3c4e-374c-4fa8-a579-383df21bd26e/replay}
                  ranking:
                    previous_rank: null
                    rank: null
                    total: 4
                    personal_best_improved: false
                    previous_best_ms: null
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: RANKING_DISABLED (ranking disabled for this level) or ACCOUNT_SUSPENDED.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [ACCOUNT_SUSPENDED, RANKING_DISABLED]}
              example:
                ok: false
                error: {code: RANKING_DISABLED, message: Le classement de ce niveau est désactivé.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '404':
          description: LEVEL_NOT_FOUND.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [LEVEL_NOT_FOUND]}
              example:
                ok: false
                error: {code: LEVEL_NOT_FOUND, message: Niveau inconnu du serveur.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '409':
          description: LEVEL_VERSION_MISMATCH or LEVEL_VERSION_RETIRED (details.current_version), ATTEMPT_CONFLICT (same attempt_id already submitted with another
            time_ms, deaths or level_hash), DUPLICATE_SUBMISSION (two identical submissions raced).
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum: [LEVEL_VERSION_MISMATCH, LEVEL_VERSION_RETIRED, ATTEMPT_CONFLICT, DUPLICATE_SUBMISSION]
              example:
                ok: false
                error:
                  code: LEVEL_VERSION_MISMATCH
                  message: Cette version du niveau n'est pas reconnue par le serveur.
                  details: {current_version: 2}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: 'CATEGORY_RULES_NOT_MET (details: list of French strings; HUNDRED_PERCENT needs every collectible, NO_DEATH and NO_DAMAGE need 0 deaths, NO_DAMAGE
            needs 0 damage) or INCONSISTENT_PROGRESS (total_collectibles differs from the revision''s, or collectibles exceeds it). Nothing is stored.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [CATEGORY_RULES_NOT_MET, INCONSISTENT_PROGRESS]}
              example:
                ok: false
                error:
                  code: CATEGORY_RULES_NOT_MET
                  message: Le run ne respecte pas les règles de la catégorie.
                  details: [le run contient des morts]
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '426':
          description: 'GAME_VERSION_UNSUPPORTED: game_version is below the revision''s min_game_version or the server''s MIN_GAME_VERSION; details.min_game_version
            is the revision''s.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [GAME_VERSION_UNSUPPORTED]}
              example:
                ok: false
                error:
                  code: GAME_VERSION_UNSUPPORTED
                  message: Version du jeu trop ancienne pour le classement en ligne.
                  details: {min_game_version: 2.1.0}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
