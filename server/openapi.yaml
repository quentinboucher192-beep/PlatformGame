              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorEnvelope'}
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code: {type: string, enum: [ACCOUNT_SUSPENDED, FRIEND_REQUESTS_DISABLED]}
              example:
                ok: false
                error: {code: FRIEND_REQUESTS_DISABLED, message: Ce joueur n'accepte pas les demandes d'amis.}
                request_id: c4c16a63-d3a9-450b-b73a-925f325b55b0
        '404':
          description: PLAYER_NOT_FOUND (unknown or suspended target).
