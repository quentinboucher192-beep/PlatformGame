name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC) + installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-win-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage
        run: cmake --install build --config Release --prefix build/stage
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe" }
          & $iscc "/DStageDir=$PWD\build\stage" installer\CosmicPlatformer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CosmicPlatformer-Setup
          path: installer/Output/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CosmicPlatformer-portable-windows
          path: build/stage
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy

  # Automatic GitHub release (2.93): once per version, for pushes to the development branch, as soon
  # as the Windows job has built the installer (2.95: even when one of its tests failed — the notes
  # then say so; a job cancelled or without an installer publishes nothing). The installer and its
  # notes (data/news/changelog.json, French + English, every version since the previous release:
  # tools/release/notes.py). A version already released is skipped, so later pushes at the same
  # version change nothing.
  release:
    name: Release GitHub (automatique)
    needs: windows
    if: always() && needs.windows.result != 'cancelled' && needs.windows.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/claude/cosmic-platformer-2d-15v4i5'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CosmicPlatformer-Setup
          path: dist
      - name: Publish the release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          VER=$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG est déjà publiée : rien à faire."
            exit 0
          fi
          EXE=$(ls dist/*.exe | head -1)
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$PREV" ]; then
            python3 tools/release/notes.py "$VER" --since "$PREV" --exe "$EXE" > notes.md
          else
            python3 tools/release/notes.py "$VER" --exe "$EXE" > notes.md
          fi
          if [ "$WINDOWS_RESULT" != "success" ]; then
            printf '\n> Tests Windows de cette version : échec (voir le journal de la CI) — Windows tests of this version: failed (see the CI log).\n' >> notes.md
          fi
          gh release create "$TAG" "$EXE" --target "$GITHUB_SHA" --title "Cosmic Platformer $VER" \
            --notes-file notes.md --prerelease

  linux:
    name: Linux (GCC) + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libxcursor-dev libasound2-dev libpulse-dev \
            libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libxtst-dev libdbus-1-dev libudev-dev libwayland-dev wayland-protocols \
            libcurl4-openssl-dev
      - name: Python imaging (the versions the asset generators were run with, for their byte-exact checks)
        run: python3 -m pip install --user --break-system-packages pillow==12.3.0 numpy==2.5.3
      - name: Hit parts of the bosses up to date (2.76.0, docs/HITPARTS.md)
        run: python3 tools/assetgen/hitparts.py --check
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy

  server:
    name: Cosmic Online server (Workers + D1, local)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests (Miniflare, no Cloudflare account)
        run: npx vitest run
